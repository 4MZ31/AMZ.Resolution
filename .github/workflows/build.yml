name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build ResolutionTray.slnx -c Release --nologo
      - name: Test and package portable application
        shell: pwsh
        run: ./build.ps1
      - name: Verify native updater restart and rollback
        shell: pwsh
        run: ./tests/UpdaterIntegration.ps1 -ApplicationExe ./artifacts/portable/ResolutionTray.exe -RequireRun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amd-resolution-tray-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
